[package]
name = "book-reader"
version = "0.1.0"
description = "קורא ספרים"
authors = []
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = [
  "dialog-open",
  "fs-read-file",
  "window-all"
] }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# used for production builds where distDir is a folder on disk
custom-protocol = ["tauri/custom-protocol"]
